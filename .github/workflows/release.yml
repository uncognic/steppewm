name: Release

on:
  push:
    tags: [ 'v*' ]

jobs:
  release:
    runs-on: ubuntu-26.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            meson ninja-build pkg-config \
            libwlroots-0.19-dev \
            wayland-protocols \
            libwayland-dev \
            libxkbcommon-dev \
            libinput-dev \
            libpixman-1-dev \
            libcairo2-dev \
            liblua5.4-dev \
            libpulse-dev \
            libsdbus-c++-dev \
            librsvg2-dev

      - name: Build
        run: make configure build

      - name: Package
        run: tar czf steppewm-${{ github.ref_name }}-linux-x86_64.tar.gz -C build steppewm

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: steppewm-${{ github.ref_name }}-linux-x86_64.tar.gz
