name: Build (Ubuntu x86)

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            cmake ninja-build pkg-config \
            libwlroots-dev \
            wayland-protocols \
            libwayland-dev \
            libxkbcommon-dev \
            libinput-dev \
            libpixman-1-dev \
            libcairo2-dev \
            liblua5.4-dev \
            libpulse-dev \
            libsdbus-c++-dev \
            librsvg2-dev

      - name: Build
        run: make configure build
